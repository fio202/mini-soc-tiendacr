# TiendaCR - proxy inverso REMEDIADO (punto 2.8)
# Cambios respecto a tiendacr.conf:
#   C1 Nivel de seguridad de la aplicacion forzado a "impossible" (consultas preparadas,
#      token anti-CSRF y bloqueo por intentos en DVWA). El cliente no puede bajarlo con su cookie.
#   C2 Limite de velocidad en los formularios de autenticacion (anti fuerza bruta).
#   C3 Prohibida la ejecucion de PHP en el directorio de subidas (anti web shell).
#   C4 Cabeceras de seguridad HTTP.

# C1: reescribe la cookie "security" que llega del cliente
map $http_cookie $cookie_forzada {
    ""                                                 "security=impossible";
    "~^(?<antes>.*)security=[A-Za-z]+(?<despues>.*)$"  "${antes}security=impossible${despues}";
    default                                            "$http_cookie; security=impossible";
}

# C2: 10 peticiones por minuto por IP a los formularios de autenticacion
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_status 429;

server {
    listen 192.168.56.10:80 default_server;
    server_name tiendacr.lab;
    server_tokens off;

    access_log /var/log/nginx/tiendacr_access.log combined;
    error_log  /var/log/nginx/tiendacr_error.log warn;

    client_max_body_size 2m;

    # C4
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $cookie_forzada;                 # C1

    # C2
    location ~ ^/(login\.php|vulnerabilities/brute/) {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:4280;
    }

    # C3: lo subido se sirve como dato, nunca se ejecuta
    location ~* ^/hackable/uploads/.*\.(php\d?|phtml|phar)$ {
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:4280;
    }
}
