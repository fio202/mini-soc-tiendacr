# Proxy inverso de TiendaCR: unico punto de entrada HTTP a la aplicacion.
# Deja un access log en el host (formato combined) que Wazuh decodifica de forma nativa.
server {
    listen 192.168.56.10:80 default_server;
    server_name tiendacr.lab;
    server_tokens off;

    access_log /var/log/nginx/tiendacr_access.log combined;
    error_log  /var/log/nginx/tiendacr_error.log warn;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:4280;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
