<!-- TiendaCR: bloque adicional que se anexa al ossec.conf del agente -->
<ossec_config>
  <!-- Registros web del proxy nginx (inyeccion SQL, XSS, traversal, fuerza bruta web) -->
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/nginx/tiendacr_access.log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/nginx/tiendacr_error.log</location>
  </localfile>

  <!-- Alertas del IDS de red (Suricata, formato EVE JSON) -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/suricata/eve.json</location>
  </localfile>

  <!-- Bloqueos del cortafuegos -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/ufw.log</location>
  </localfile>

  <!-- Integridad de archivos: aplicacion y configuracion de seguridad -->
  <syscheck>
    <directories realtime="yes" check_all="yes" report_changes="yes">/opt/dvwa/uploads</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/nginx</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/ssh</directories>
    <directories realtime="yes" check_all="yes">/etc/ufw</directories>
    <directories realtime="yes" check_all="yes">/etc/suricata</directories>
    <directories realtime="yes" check_all="yes">/opt/dvwa/compose.yml</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/home/vagrant/.ssh</directories>
  </syscheck>
</ossec_config>
